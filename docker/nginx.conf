server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Service worker, manifest and app shell must revalidate so updates take effect.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Local reset: signs this browser out and drops cached app shell, service worker and storage.
    location = /__reset {
        add_header Clear-Site-Data '"cache", "cookies", "storage"';
        add_header Cache-Control "no-store";
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Reset</title><p>Signed out and cleared BookAtlas site data. <a href="/">Return to BookAtlas</a></p>';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
