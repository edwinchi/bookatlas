# Included in every location: nginx drops server-level add_header in locations that set their own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
# Enforced (2026-11-23). Kept identical to artifacts/api-server/src/middlewares/pageCsp.ts by pageCsp.test.ts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://clerk.booksatlas.app https://*.protect.clerk.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://img.clerk.com; media-src 'self' data: blob: https://commondatastorage.googleapis.com; connect-src 'self' https://*.clerk.accounts.dev https://clerk.booksatlas.app https://*.protect.clerk.com:* https://clerk-telemetry.com https://*.supabase.co; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp-report" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
