# Included in every location: nginx drops server-level add_header in locations that set their own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
# Enforced: directives that cannot break the app.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
# Full allowlist in report-only until signed-in Clerk flows are observed without violations.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://*.protect.clerk.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://img.clerk.com; media-src 'self' data: blob: https://commondatastorage.googleapis.com; connect-src 'self' https://*.clerk.accounts.dev https://*.protect.clerk.com:* https://clerk-telemetry.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'" always;
