# Security updates (owner request 2026-11-23: protect the site): GitHub proposes a pull request when a dependency
# has a published vulnerability, and once a week for routine updates. Nothing merges or deploys by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
