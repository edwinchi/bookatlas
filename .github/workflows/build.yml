name: Build and tests
on:
  pull_request:
  # Every branch: work happens on feature branches, and each push should be checked.
  push:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test:unit
      # In-memory data and synthetic secrets only; no credentials are needed.
      - run: pnpm test:e2e
      - run: pnpm test:catalog
      - run: pnpm build
      - run: pnpm audit --prod
