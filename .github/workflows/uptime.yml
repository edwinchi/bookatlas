# Uptime monitor (owner request 2026-11-22): checks the live site and its health endpoint every 5 minutes, the
# shortest schedule GitHub allows, at no cost on a public repository. A failed run makes GitHub email the person
# who last changed the schedule below; the history is under Actions → Uptime. Each check retries before failing so
# one slow answer does not raise an alarm.
name: Uptime
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Home page
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --retry-delay 10 --max-time 20 https://booksatlas.app/)
          echo "booksatlas.app answered $code"
          test "$code" = 200
      - name: API health
        run: |
          body=$(curl -sS --fail --retry 3 --retry-all-errors --retry-delay 10 --max-time 20 https://booksatlas.app/api/healthz)
          echo "health: $body"
          echo "$body" | grep -q '"status":"ok"'
