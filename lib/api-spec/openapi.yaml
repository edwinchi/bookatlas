openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /manager/publishing-readiness:
    get:
      operationId: getPublishingReadiness
      summary: Administrator-only publishing dependency and implementation checks
      security:
        - clerkSession: []
      responses:
        "200":
          description: Readiness checks; a successful check response does not mean publishing is enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingReadiness"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /auth/me:
    get:
      operationId: getAccount
      summary: Get the verified current account and application role
      security:
        - clerkSession: []
      responses:
        "200":
          description: Verified signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "401":
          description: Sign-in with a verified email is required
        "503":
          description: Identity provider temporarily unavailable
  /account/membership:
    post:
      operationId: upgradeOwnMembership
      summary: Apply the existing simulated member upgrade to the signed-in reader only
      security:
        - clerkSession: []
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResult"
        "401":
          description: Sign-in required
  /users/register:
    post:
      operationId: syncReaderProfile
      summary: Sync the reader profile using identity from the verified server session
      security:
        - clerkSession: []
      responses:
        "200":
          description: Reader profile synced
        "401":
          description: Sign-in required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    PublishingReadinessCheck:
      type: object
      required: [id, label, state, detail]
      properties:
        id: { type: string }
        label: { type: string }
        state: { type: string, enum: [missing, configured, verified, blocked, error] }
        detail: { type: string }
    PublishingReadiness:
      type: object
      required: [canPublish, summary, checks]
      properties:
        canPublish: { type: boolean }
        summary: { type: string }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/PublishingReadinessCheck"
    AccountIdentity:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [reader, admin] }
    MembershipResult:
      type: object
      required: [success, tier]
      properties:
        success: { type: boolean }
        tier: { type: string, enum: [free_reader, member_subscriber, vip_patron] }
    AccountProfile:
      type: object
      required: [user, tier]
      properties:
        user:
          $ref: "#/components/schemas/AccountIdentity"
        tier: { type: string, enum: [free_reader, member_subscriber, vip_patron] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

