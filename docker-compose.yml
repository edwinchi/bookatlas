# Local container stack for BookAtlas. Run with:
#   docker compose --env-file .env.local up --build
# The API runs on in-memory seed data; Supabase settings are deliberately cleared.
services:
  # Express API Server Container
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bookatlas-api
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_URL: http://localhost:5173
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  # React / Vite Static Web Frontend Container with Nginx Proxy
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
    container_name: bookatlas-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  # EPUBCheck worker (TASK-0003). Needs EBOOK_WORKER_TOKEN (32+ characters) in .env.local;
  # without it the API skips EPUBCheck and the worker exits.
  epubcheck:
    build:
      context: .
      dockerfile: artifacts/epubcheck-worker/Dockerfile
    container_name: bookatlas-epubcheck
    restart: on-failure:3
    environment:
      API_URL: http://api:3001
      EBOOK_WORKER_TOKEN: ${EBOOK_WORKER_TOKEN:-}
      POLL_SECONDS: 5
    depends_on:
      api:
        condition: service_healthy

  # Test runner (profile "test"): shares the web container's network, so the app is http://localhost:5173,
  # the same origin as on the host (a secure context for the service worker, and same-origin for the API).
  #   docker compose --env-file .env.local --profile test run --rm --build tests
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    network_mode: "service:web"
    init: true
    shm_size: "1gb"
    environment:
      BASE_URL: http://localhost:5173
      # Development keys only: test:account fetches a Clerk testing token to pass bot protection.
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    depends_on:
      web:
        condition: service_started
